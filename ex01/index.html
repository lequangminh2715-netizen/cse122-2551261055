<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
    h1 {
        color: #D40000;
        background-color: #FFD9E6;
        text-align: center;
    }
    p {
    text-align: center;
    font-style: italic;
    font-size: 18px;
}
    article {
            width: 640px;
            box-sizing: border-box;
            padding: 24px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
     }
    .xanh {
    color: #0033CC;
    }

    .do {
    color: #D40000;
    }
hr {
    width: 55%;
    border: none;
    border-top: 1px solid #0033CC;
    margin: 1px auto;
}

</style>
    </head>
    <body>
        <article>
        <h1>BỐN MÙA</h1>
        <p class="xanh"> 
            Xuân về hoa nở khắp trời <br>
            Hạ sang nắng cháy rạng ngời phố quen <br> 
            Thu về lá rụng bên thềm</p>
        <hr>
        <p class="do">
        Đông sang gió lạnh bên em đợi chờ <br> 
        Bốn mùa là bốn giấc mơ <br> 
        Thời gian đi mãi ta chờ đợi ai</p>
        <hr>
        <p class="xanh">
        Một năm rồi lại một năm <br> 
        Vẫn còn câu hát thì thầm quê hương <br> 
        Chờ xuân nắng mới soi đường</p>
        </article>
    </body>
</html>
